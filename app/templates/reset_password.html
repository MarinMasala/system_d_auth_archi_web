{% extends 'base.html' %}

{% block title %}Nouveau mot de passe | DGFiP{% endblock %}

{% block content %}
<section class="main-grid">
  <div class="card form-card">
    <div class="page-header">
      <h2>Choisir un nouveau mot de passe</h2>
      <p>12 caractères minimum, avec une majuscule, un chiffre et un caractère spécial.</p>
    </div>

    <form class="form-grid" data-form="reset-password" data-token="{{ token }}" novalidate>
      <div class="field">
        <label for="new_password">Nouveau mot de passe</label>
        <div class="password-wrap">
          <input id="new_password" name="new_password" type="password" autocomplete="new-password" required />
          <button type="button" class="password-toggle" aria-label="Afficher le mot de passe">Afficher</button>
        </div>
      </div>

      <div class="field">
        <label for="confirm_new_password">Confirmer le mot de passe</label>
        <div class="password-wrap">
          <input id="confirm_new_password" name="confirm_new_password" type="password" autocomplete="new-password" required />
          <button type="button" class="password-toggle" aria-label="Afficher le mot de passe">Afficher</button>
        </div>
      </div>

      <div class="form-actions">
        <button class="btn btn-primary" type="submit">Modifier le mot de passe</button>
        <a class="inline-link" href="/login">Retour à la connexion</a>
      </div>

      <div class="form-status" aria-live="polite"></div>
    </form>
  </div>
</section>
{% endblock %}
